<!DOCTYPE html>
<html lang="pt-BR">

  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: "Courier New", Courier, Georgia, serif;
      -webkit-font-smoothing: antialiased;

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .void-message {
      max-width: 720px;
      color: #ffffff;
      font-size: clamp(14px, 1.6vw, 18px);
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: 0.04em;
      user-select: none;
    }
  </style>
</head>
<body>
  <p class="void-message">
    nada que e bom fica pronto rapido, o apocalipse esta por vir, busque refugio, reflita, unifique-se e somente entao emerja.
